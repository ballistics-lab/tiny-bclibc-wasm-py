[build-system]
# ziglang is the wasm32 C compiler (clang + wasi libc/libm) build_wasm.py uses: every build compiles
# the .wasm modules itself, so nothing needs to be preinstalled. TINY_BCLIBC_CC overrides it.
requires = ["setuptools>=77", "setuptools_scm>=8", "ziglang>=0.16.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-bclibc-wasm"
dynamic = ["version"]
description = "micropython-bclibc's tiny_bclibc API for CPython, PyPy and Pythonista, backed by tiny_bclibc compiled to WebAssembly"
readme = "README.md"
authors = [{ name = "o-murphy", email = "thehelixpg@gmail.com" }]
license = "LGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# In-process WebAssembly host for desktops; without it the package uses Node or WebKitGTK
# JavaScriptCore, and in Pythonista it uses JSContext (see src/tiny_bclibc/_runner.py).
wasmtime = ["wasmtime"]
# py-ballisticcalc engines (tiny_bclibc.pybc, registered below). Full support: py-ballisticcalc 3.x
# (Python 3.11+). Partial backward compatibility: on Python 3.10, py-ballisticcalc 2.2.10 (its last
# release for 3.10). There the engines work, but 3 of 2.x's tests fail, because 2.x expects ZERO/MACH/APEX
# merged onto a nearby RANGE row, which 3.x (and this adapter) keeps as separate rows.
pybc = [
    "py-ballisticcalc>=3.0.0b1; python_version >= '3.11'",
    "py-ballisticcalc>=2.2.10; python_version < '3.11'",
    "typing_extensions",
]

# py-ballisticcalc engines: "<engine>+<method>" names (py-ballisticcalc >= 3.0.0b3) ...
[project.entry-points."py_ballisticcalc.engines.tiny_bclibc_wasm"]
tsitouras-dp = "tiny_bclibc.pybc:TinyBclibcWasmTsitourasEngineDP"
tsitouras-sp = "tiny_bclibc.pybc:TinyBclibcWasmTsitourasEngineSP"

# ... and the legacy flat group, the only one py-ballisticcalc 3.0.0b1/b2 read
[project.entry-points.py_ballisticcalc]
tiny_bclibc_wasm_engine = "tiny_bclibc.pybc:TinyBclibcWasmTsitourasEngineDP"
tiny_bclibc_wasm_sp_engine = "tiny_bclibc.pybc:TinyBclibcWasmTsitourasEngineSP"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["tiny_bclibc"]
include-package-data = false

[tool.setuptools.package-data]
tiny_bclibc = ["*.wasm", "*.pyi", "py.typed"]

[tool.setuptools_scm]
# Until the repo has a tag (or any commit), there is nothing to derive a version from.
fallback_version = "0.0.0"

[tool.uv]
# Rebuild the editable install (and so the .wasm modules) when the C sources or build hooks change,
# not only when pyproject.toml does.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "setup.py" },
    { file = "build_wasm.py" },
    { file = "bclibc/tiny_bclibc/wasm/*.c" },
    { file = "bclibc/tiny_bclibc/include/**/*.h" },
    { git = { commit = true } },
]

[dependency-groups]
dev = [
    "mypy>=2.3.1; platform_python_implementation == 'CPython'", # stubtest only; its ast-serialize has no PyPy wheel
    "pre-commit>=4.6.2",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
    "setuptools>=84.0.0",
    "setuptools-scm>=10.2.3",
    "wasmtime>=49.0.0",
    # wasm3 host; CPython 3.11+ only, and taken from git (see [tool.uv.sources])
    "pywasm3; python_version >= '3.11' and platform_python_implementation == 'CPython'",
    # tiny_bclibc.pybc's test suite is py-ballisticcalc's own; taken from the py-ballisticcalc submodule (see [tool.uv.sources])
    "py-ballisticcalc; python_version >= '3.11'",
]

[tool.uv.sources]
# pywasm3's PyPI release is years behind the API Wasm3Runner uses; build it from the repo (uv also
# fetches its wasm3 submodule). Needs a C compiler.
pywasm3 = { git = "https://github.com/wasm3/pywasm3", rev = "fce65fd7fdffd8b6866a4a6f7612a0a5bc28b018" } # Py_mod_gil support (3790b9b) + merge
# The package and its tests/ from one commit: `uv run pytest py-ballisticcalc/tests --engine=tiny_bclibc_wasm+tsitouras-dp`.
# Bump it like bclibc: `git -C py-ballisticcalc checkout <tag>`, then `uv lock`.
# The submodule's py-ballisticcalc needs 3.11+; on 3.10 the [pybc] extra resolves from PyPI.
py-ballisticcalc = { path = "py-ballisticcalc", marker = "python_version >= '3.11'" }


[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-rf"
testpaths = ["tests"]

[tool.coverage.run]
source = ["tiny_bclibc"]
relative_files = true

[tool.coverage.report]
show_missing = true

[tool.pyright]
include = ["src", "tests", "examples", "build_wasm.py", "setup.py"]
strict = ["src"]

[tool.ruff]
include = [
    "pyproject.toml",
    "src/**/*.py",
    "build_wasm.py",
    "setup.py",
    "tests/**/*.py",
    "examples/**/*.py",
]
extend-exclude = ["bclibc", "py-ballisticcalc"]
line-length = 120

[tool.ruff.lint]
ignore = ["F403", "F405"]
